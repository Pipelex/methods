[package]
name = "documents"
display_name = "Documents"
address = "github.com/Pipelex/methods"
version = "0.1.1"
description = "Document extraction methods for text, images, and page views."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "extract_document_markdown"

[exports.documents]
pipes = [
  "extract_markdown_pages",
  "extract_page_contents",
  "extract_page_contents_and_views",
  "extract_text_pages",
  "join_texts_from_pages",
  "extract_document_text",
  "extract_document_markdown",
]
