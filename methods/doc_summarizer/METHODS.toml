[package]
name = "doc_summarizer"
display_name = "Document Summarizer"
address = "github.com/Pipelex/methods"
version = "0.2.0"
description = "Deep document summarization: profile the document and extract importance-ranked key points in parallel, then synthesize a structured summary with themes and open questions."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "summarize_document"

[exports.document_summarization]
pipes = [
  "summarize_document",
  "profile_document",
  "extract_key_points",
  "synthesize_summary",
]
