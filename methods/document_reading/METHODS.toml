[package]
name = "document_reading"
display_name = "Document Reading"
address = "github.com/Pipelex/methods"
version = "0.4.1"
description = "Read a document page by page for a caller who will not see it: every rule, value, threshold, name and constraint each page states or shows, in its exact words, from both the OCR text and a picture of the page, with what each page could not be read and what was not looked at."
authors = ["Evotis S.A.S"]
license = "MIT"
mthds_version = ">=1.0.0"
main_pipe = "read_document"

[exports.document_reading]
pipes = ["read_document", "read_pages"]
